<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BZSS Replay Player</title><style>body{margin:0;background:#07111f;color:#e8f0fb;font:14px system-ui}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.sidebar{padding:16px;border-right:1px solid #1f4153}.card,button{border:1px solid #31566a;border-radius:8px;background:#0c2031;color:inherit}.card{padding:12px;margin:8px 0;cursor:pointer}.card:hover,.card.active{border-color:#42d7a3;background:#123b43}.main{padding:18px;min-width:0}.map{height:62vh;display:grid;place-items:center;border:1px solid #31566a;border-radius:10px;background:radial-gradient(circle,#173752,#06111d);position:relative;overflow:auto}.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#5ac8ff}.dot.t2{background:#ff6874}.controls{display:flex;gap:8px;align-items:center;padding:12px 0}button{padding:8px 12px;cursor:pointer}input[type=range]{width:min(60vw,700px)}small{color:#89a8b8}#status{color:#6de4bb}</style><body><div class="app"><aside class="sidebar"><h2>回放档案</h2><small id="status">扫描中…</small><div id="list"></div></aside><main class="main"><h1 id="title">选择一个回放</h1><div class="map" id="map">独立回放播放器<br><small>地图资源将在下一阶段接入</small></div><div class="controls"><button id="back">−5 秒</button><button id="play">▶ 播放</button><button id="forward">+5 秒</button><button data-rate=".5">0.5×</button><button data-rate="1">1×</button><button data-rate="2">2×</button><input id="time" type="range" min="0" max="1" value="0"><strong id="clock">0:00 / 0:00</strong></div><section id="summary"></section></main></div><script type="module" src="/player.js"></script></body></html>
