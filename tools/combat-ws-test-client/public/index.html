<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BZSS Combat WS Test Client</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><p class="eyebrow">BZSS COMBAT WS · V1</p><h1>协议测试客户端</h1></div><div id="connection" class="pill">读取中</div></header><section class="controls"><label>WS 地址<input id="target"></label><label>Token<input id="token" type="password"></label><label>Client ID<input id="client"></label><label>ACK 延迟(ms)<input id="delay" type="number" min="0"></label><label class="check"><input id="ack" type="checkbox">自动 ACK</label><label class="check"><input id="pong" type="checkbox">自动 Pong</label><label class="check"><input id="reconnect" type="checkbox">自动重连</label><div class="actions"><button id="apply">应用并连接</button><button id="bad">发送错误协议</button><a href="/api/export">导出记录</a></div></section><section id="metrics" class="metrics"></section><section><h2>报文</h2><div id="messages" class="messages"></div></section></main><script type="module" src="/app.js"></script></body></html>
