name: Apply capture point drag fix

on:
  push:
    branches: [NewTest]
    paths:
      - .github/workflows/bzss-agent-capture-point-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: NewTest
          fetch-depth: 0

      - name: Patch tactical map capture point dragging
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('web-client/src/pages/TacticalMapPage.vue')
          text = path.read_text(encoding='utf-8')

          old_display = '''const captureZoneDisplayMarkers = computed<CaptureZoneMarker[]>(() => {
            return captureZoneMarkers.value.map((marker) => {
              const preview = capturePointDrag.value?.markerId === marker.id
                ? capturePointDrag.value
                : capturePointOverrides.value.get(marker.id);
              if (!preview) return marker;
              return {
                ...marker,
                mapX: preview.mapX,
                mapY: preview.mapY,
                gameX: preview.gameX,
                gameY: preview.gameY,
              };
            });
          });'''
          new_display = '''const captureZoneDisplayMarkers = computed<CaptureZoneMarker[]>(() => {
            return captureZoneMarkers.value.map((marker) => {
              // Persisted overrides represent the last committed edit. During an
              // active drag the real button stays here so its hit target never moves.
              const override = capturePointOverrides.value.get(marker.id);
              if (!override) return marker;
              return {
                ...marker,
                mapX: override.mapX,
                mapY: override.mapY,
                gameX: override.gameX,
                gameY: override.gameY,
              };
            });
          });

          const capturePointDragPreview = computed<CaptureZoneMarker | null>(() => {
            const drag = capturePointDrag.value;
            if (!drag || !drag.moved) return null;
            const marker = captureZoneDisplayMarkers.value.find((entry) => entry.id === drag.markerId);
            if (!marker) return null;
            return {
              ...marker,
              mapX: drag.mapX,
              mapY: drag.mapY,
              gameX: drag.gameX,
              gameY: drag.gameY,
            };
          });'''
          if text.count(old_display) != 1:
              raise SystemExit('captureZoneDisplayMarkers block did not match exactly once')
          text = text.replace(old_display, new_display, 1)

          template_anchor = '''          </button>
          </div>

        <!-- FOB Overlay -->'''
          preview_markup = '''          </button>

          <div
            v-if="capturePointDragPreview"
            class="capture-point-drag-preview"
            :style="{
              left: `${capturePointDragPreview.mapX}%`,
              top: `${capturePointDragPreview.mapY}%`,
              '--capture-marker-scale': dynamicMarkerScale,
              '--capture-progress-deg': `${capturePointDragPreview.captureProgress * 3.6}deg`,
            }"
            aria-hidden="true"
          >
            <span class="capture-point-index">P{{ capturePointDragPreview.pointIndex }}</span>
            <span
              class="capture-zone-flag"
              :class="[
                `team-${capturePointDragPreview.captureTeamId ?? capturePointDragPreview.teamId ?? 0}`,
                { 'is-capturing': capturePointDragPreview.isCapturing },
              ]"
            >
              <span class="zone-flag-visual">
                <img
                  v-if="capturePointDragPreview.flagUrl"
                  class="zone-flag-image"
                  :src="capturePointDragPreview.flagUrl"
                  :alt="capturePointDragPreview.factionLabel"
                  draggable="false"
                />
                <span v-else class="zone-flag-placeholder"></span>
                <span class="capture-flag-neutral-sweep"></span>
                <span v-if="capturePointDragPreview.isLocked" class="zone-flag-lock" aria-label="Locked"></span>
              </span>
              <span class="zone-flag-name">{{ capturePointDragPreview.name }}</span>
            </span>
          </div>
        </div>

        <!-- FOB Overlay -->'''
          if text.count(template_anchor) != 1:
              raise SystemExit('capture zone template anchor did not match exactly once')
          text = text.replace(template_anchor, preview_markup, 1)

          disabled_drag = re.compile(
              r'function startCapturePointDrag\(_zone: CaptureZoneMarker, _event: PointerEvent\) \{\n'
              r'  // Dragging is temporarily disabled\n'
              r'  return;\n'
              r'  /\*\n'
              r'(.*?)\n'
              r'  \*/\n'
              r'\}',
              re.S,
          )
          match = disabled_drag.search(text)
          if not match:
              raise SystemExit('disabled startCapturePointDrag wrapper not found')
          restored_drag = 'function startCapturePointDrag(zone: CaptureZoneMarker, event: PointerEvent) {\n' + match.group(1) + '\n}'
          text, count = disabled_drag.subn(restored_drag, text, count=1)
          if count != 1:
              raise SystemExit('failed to restore startCapturePointDrag')

          old_wheel = '''function onWheel(e: WheelEvent) {
            if (!containerRef.value) return;'''
          new_wheel = '''function onWheel(e: WheelEvent) {
            // Keep the drag coordinate transform stable until the point is released.
            if (capturePointDrag.value) return;
            if (!containerRef.value) return;'''
          if text.count(old_wheel) != 1:
              raise SystemExit('onWheel anchor did not match exactly once')
          text = text.replace(old_wheel, new_wheel, 1)

          css_anchor = '''@import "../styles/tactical-map.css";
'''
          css_patch = '''@import "../styles/tactical-map.css";

/*
 * Capture-point editing uses a fixed input anchor plus a separate visual preview.
 * The hit box is zoom-compensated so it stays screen-stable instead of expanding
 * with the transformed 1000x1000 map canvas.
 */
.capture-zone-marker {
  width: calc(58px * var(--capture-marker-scale, 1));
  height: calc(58px * var(--capture-marker-scale, 1));
}

.capture-zone-marker.is-point-dragging .capture-zone-flag,
.capture-zone-marker.is-point-dragging .capture-point-index {
  opacity: .42;
}

.capture-point-drag-preview {
  position: absolute;
  width: calc(58px * var(--capture-marker-scale, 1));
  height: calc(58px * var(--capture-marker-scale, 1));
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 43;
}

.capture-point-drag-preview .capture-zone-flag {
  filter: drop-shadow(0 0 10px rgba(250, 204, 21, .95)) brightness(1.18);
}
'''
          if text.count(css_anchor) != 1:
              raise SystemExit('style import anchor did not match exactly once')
          text = text.replace(css_anchor, css_patch, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch shape
        shell: bash
        run: |
          grep -q "const capturePointDragPreview" web-client/src/pages/TacticalMapPage.vue
          grep -q "function startCapturePointDrag(zone: CaptureZoneMarker, event: PointerEvent)" web-client/src/pages/TacticalMapPage.vue
          ! grep -q "Dragging is temporarily disabled" web-client/src/pages/TacticalMapPage.vue
          git diff --check

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/bzss-agent-capture-point-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-client/src/pages/TacticalMapPage.vue .github/workflows/bzss-agent-capture-point-fix.yml
          git commit -m "Fix capture point edit dragging"
          git push origin HEAD:NewTest
