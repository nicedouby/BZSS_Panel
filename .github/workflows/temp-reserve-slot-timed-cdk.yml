name: Apply timed reserve-slot CDK patch

on:
  push:
    branches:
      - agent/reserve-slot-timed-cdk
    paths:
      - .github/workflows/temp-reserve-slot-timed-cdk.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reserve-slot-timed-cdk
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-client/package-lock.json

      - name: Apply patch
        run: python .github/scripts/apply_timed_cdk_patch.py

      - name: Check patch
        run: |
          git diff --check
          node --check app/modules/reserve-slots/index.js
          node --check app/modules/reserve-slots/routes.js

      - name: Install backend dependencies
        run: npm ci

      - name: Run reserve-slot tests
        run: node app/tests/run-reserve-slots-tests.js

      - name: Install client dependencies
        run: npm ci --prefix web-client

      - name: Build client
        run: npm run client:build

      - name: Commit verified changes
        run: |
          git config user.name "OpenAI GitHub Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/modules/reserve-slots/index.js app/modules/reserve-slots/routes.js app/tests/run-reserve-slots-tests.js web-client/src/app/reserveSlotsApi.ts web-client/src/components/settings/ReserveSlotsSection.vue
          git commit -m "add timed reserve slot CDK activation"
          git push origin HEAD:agent/reserve-slot-timed-cdk
